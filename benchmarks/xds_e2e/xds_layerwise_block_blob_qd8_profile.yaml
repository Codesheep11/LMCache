chunk_size: 256
local_cpu: false
use_layerwise: true
save_unfull_chunk: true
py_enable_gc: false
xds_service_name: xds0
xds_backend: true
cascadekv_backend: false
xds_require_direct: true
xds_windowed_io: true
xds_read_window_size: 64
xds_write_window_size: 64
xds_io_queue_depth: 8
xds_read_slot_count: 2
xds_write_slot_count: 1
xds_async_write: false
extra_config:
  benchmark_transfer_metrics: true
  xds_layerwise_block_blob: true
  xds_layerwise_io_window_layers: 8
  cascadekv_layerwise_gpu_producer: true
  cascadekv_h2d_max_submitted_ahead_layers: 8
  cascadekv_h2d_max_inflight_layers: 2
  cascadekv_layerwise_h2d_scatter_overlap: false
  cascadekv_h2d_stream_priority: -1
  cascadekv_layerwise_timeline_trace: true
